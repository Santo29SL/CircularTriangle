<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="1200" height="400" rx="22" fill="#F8F5F2"/><text x="600" y="44" font-size="22" fill="#6B7280" font-weight="800" text-anchor="middle">TWO FEEDBACK LOOPS</text><rect x="30" y="70" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E76F51" stroke-width="3"/><path d="M30,88 a18,18 0 0 1 18,-18 h524 a18,18 0 0 1 18,18 v38 h-560 z" fill="#E76F51"/><text x="310" y="107" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">LOOP 1 · pick the best 2D candidate</text><rect x="55" y="170" width="150" height="64" rx="12" fill="#E76F51"/><text x="130.0" y="208.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">N candidates</text><rect x="235" y="170" width="150" height="64" rx="12" fill="#8E44AD"/><text x="310.0" y="208.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Score each</text><rect x="415" y="170" width="150" height="64" rx="12" fill="#27AE60"/><text x="490.0" y="208.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Keep best</text><line x1="207" y1="202" x2="231" y2="202" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="387" y1="202" x2="411" y2="202" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><text x="310" y="290" font-size="18" fill="#374151" font-weight="600" text-anchor="middle">3 candidates in Fast mode, 5 in Quality.</text><text x="310" y="318" font-size="18" fill="#374151" font-weight="500" text-anchor="middle">The runner-up is kept as a backup.</text><rect x="610" y="70" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/><path d="M610,88 a18,18 0 0 1 18,-18 h524 a18,18 0 0 1 18,18 v38 h-560 z" fill="#C0392B"/><text x="890" y="107" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">LOOP 2 · verify the 3D against your sketch</text><rect x="635" y="170" width="120" height="64" rx="12" fill="#2980B9"/><text x="695.0" y="208.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Build 3D</text><polygon points="880,150 960,202 880,254 800,202" fill="#F4B63F"/><text x="880" y="198" font-size="18" fill="#1F2937" font-weight="800" text-anchor="middle">IoU</text><text x="880" y="220" font-size="18" fill="#1F2937" font-weight="800" text-anchor="middle">≥ 0.60 ?</text><rect x="1015" y="170" width="130" height="64" rx="12" fill="#27AE60"/><text x="1080.0" y="208.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Accept</text><line x1="757" y1="202" x2="796" y2="202" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="962" y1="202" x2="1011" y2="202" stroke="#27AE60" stroke-width="4" marker-end="url(#a)"/><text x="986" y="182" font-size="17" fill="#27AE60" font-weight="800" text-anchor="middle">yes</text><path d="M880,256 v36 h-185 v-50" fill="none" stroke="#C0392B" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="905" y="286" font-size="17" fill="#C0392B" font-weight="800" text-anchor="start">no: retry with next candidate</text><text x="890" y="340" font-size="17" fill="#374151" font-weight="600" text-anchor="middle">Multi-view: up to 3 versions, keep the most consistent.</text></svg>