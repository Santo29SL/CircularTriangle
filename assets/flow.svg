<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="1200" height="570" rx="22" fill="#F8F5F2"/><text x="600" y="34" font-size="22" fill="#6B7280" font-weight="800" text-anchor="middle">THE FLOW</text><rect x="25" y="50" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#34495E" stroke-width="3"/><path d="M25,66 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#34495E"/><circle cx="55" cy="78.0" r="17" fill="#FFFFFF"/><text x="55" y="85.0" font-size="20" fill="#34495E" font-weight="800" text-anchor="middle">1</text><text x="83" y="86.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Input</text><text x="45" y="140" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Draw a sketch</text><text x="45" y="166" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Upload a drawing / photo</text><text x="45" y="192" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">or give 4 photos</text><rect x="330" y="50" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><path d="M330,66 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#2A9D8F"/><circle cx="360" cy="78.0" r="17" fill="#FFFFFF"/><text x="360" y="85.0" font-size="20" fill="#2A9D8F" font-weight="800" text-anchor="middle">2</text><text x="388" y="86.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Understand</text><text x="350" y="140" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Clean strokes, find</text><text x="350" y="166" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">the silhouette. Qwen2.5-VL</text><text x="350" y="192" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">+ CLIP must agree</text><rect x="635" y="50" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#E76F51" stroke-width="3"/><path d="M635,66 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#E76F51"/><circle cx="665" cy="78.0" r="17" fill="#FFFFFF"/><text x="665" y="85.0" font-size="20" fill="#E76F51" font-weight="800" text-anchor="middle">3</text><text x="693" y="86.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">2D candidates</text><text x="655" y="140" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">N shaded photoreal</text><text x="655" y="166" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">renders: SDXL +</text><text x="655" y="192" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">ControlNet scribble</text><rect x="940" y="50" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#8E44AD" stroke-width="3"/><path d="M940,66 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#8E44AD"/><circle cx="970" cy="78.0" r="17" fill="#FFFFFF"/><text x="970" y="85.0" font-size="20" fill="#8E44AD" font-weight="800" text-anchor="middle">4</text><text x="998" y="86.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Score + rank</text><text x="960" y="140" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Each one compared to</text><text x="960" y="166" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">YOUR sketch. Scores</text><text x="960" y="192" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">shown in the UI</text><rect x="940" y="340" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#2980B9" stroke-width="3"/><path d="M940,356 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#2980B9"/><circle cx="970" cy="368.0" r="17" fill="#FFFFFF"/><text x="970" y="375.0" font-size="20" fill="#2980B9" font-weight="800" text-anchor="middle">5</text><text x="998" y="376.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Build 3D</text><text x="960" y="430" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">TripoSR</text><text x="960" y="456" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Zero123++ &gt; Hunyuan3D</text><text x="960" y="482" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">TRELLIS.2</text><rect x="635" y="340" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/><path d="M635,356 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#C0392B"/><circle cx="665" cy="368.0" r="17" fill="#FFFFFF"/><text x="665" y="375.0" font-size="20" fill="#C0392B" font-weight="800" text-anchor="middle">6</text><text x="693" y="376.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Verify (loop)</text><text x="655" y="430" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Project mesh to 2D,</text><text x="655" y="456" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">IoU vs your sketch.</text><text x="655" y="482" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Below 0.60: retry</text><rect x="330" y="340" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#27AE60" stroke-width="3"/><path d="M330,356 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#27AE60"/><circle cx="360" cy="368.0" r="17" fill="#FFFFFF"/><text x="360" y="375.0" font-size="20" fill="#27AE60" font-weight="800" text-anchor="middle">7</text><text x="388" y="376.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Clean up</text><text x="350" y="430" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">Repair holes, smooth,</text><text x="350" y="456" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">decimate, check</text><text x="350" y="482" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">watertight</text><rect x="25" y="340" width="235" height="190" rx="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><path d="M25,356 a16,16 0 0 1 16,-16 h203 a16,16 0 0 1 16,16 v40 h-235 z" fill="#1F2937"/><circle cx="55" cy="368.0" r="17" fill="#FFFFFF"/><text x="55" y="375.0" font-size="20" fill="#1F2937" font-weight="800" text-anchor="middle">8</text><text x="83" y="376.0" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Export</text><text x="45" y="430" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">.glb  .obj  .stl</text><text x="45" y="456" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">4 rendered views</text><text x="45" y="482" font-size="17" fill="#1F2937" font-weight="500" text-anchor="start">+ full report</text><line x1="266" y1="145.0" x2="322" y2="145.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="571" y1="145.0" x2="627" y2="145.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="876" y1="145.0" x2="932" y2="145.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="1057.5" y1="246" x2="1057.5" y2="332" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="934" y1="435.0" x2="878" y2="435.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="629" y1="435.0" x2="573" y2="435.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="324" y1="435.0" x2="268" y2="435.0" stroke="#6B7280" stroke-width="4" marker-end="url(#a)"/><line x1="752.5" y1="332" x2="752.5" y2="248" stroke="#C0392B" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="768.5" y="296.0" font-size="17" fill="#C0392B" font-weight="700" text-anchor="start">IoU too low: try the next candidate</text></svg>