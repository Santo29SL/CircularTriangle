e">Looks like the</text><text x="899.5" y="312" font-size="16" fill="#374151" font-weight="500" text-anchor="middle">identified object</text><rect x="985.0" y="140" width="159.0" height="90" rx="14" fill="#27AE60"/><text x="1064.5" y="198" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="middle">15%</text><text x="1064.5" y="262" font-size="19" fill="#27AE60" font-weight="800" text-anchor="middle">3D-READY</text><text x="1064.5" y="290" font-size="16" fill="#374151" font-weight="500" text-anchor="middle">Clean, compact,</text><text x="1064.5" y="312" font-size="16" fill="#374151" font-weight="500" text-anchor="middle">shaded object</text><text x="600" y="360" font-size="19" fill="#6B7280" font-weight="600" text-anchor="middle">The winner is highlighted in the UI, and every part of its score is visible.</text></svg>